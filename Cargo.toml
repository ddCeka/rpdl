[package]
name = "rpdl"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Downloader with resumable option"

[dependencies]
async-trait = "0.1.89"
bytes = "1.11.0"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive", "env"] }
clap-markdown = "0.1.5"
clap_complete = "4.5.61"
color-eyre = "0.6.5"
colored = "3.0.0"
dirs = "6.0.0"
flate2 = "1.1.5"
futures = "0.3.31"
indicatif = "0.18.3"
librqbit = "8.1.1"
macror = { path = "./macror", version = "0.1.0" }
octocrab = "0.54.1"
open = "5.3.3"
regex = "1.12.2"
reqwest = { version = "0.12.28", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
smart-default = "0.7.1"
tar = "0.4.44"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
zip = "8.6.0"

[profile.dev]
codegen-units = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
